    /* GitHub Pages serves this file at whatever URL was missing, including
       nested ones like /exeter/nope. Point relative links back at the site
       root so styles and links still work there.
       The github.io branch assumes a project site (<user>.github.io/<repo>/).
       On a custom domain the root is simply "/". */
    (function () {
      var parts = location.pathname.split("/");
      var root = "/";
      if (/\.github\.io$/.test(location.hostname) && parts.length > 2 && parts[1]) {
        root = "/" + parts[1] + "/";
      }
      var base = document.createElement("base");
      base.href = root;
      document.head.appendChild(base);
      /* <base> also re-resolves "#main", which would send the skip link
         to the home page. Keep it on this page. */
      document.addEventListener("DOMContentLoaded", function () {
        var skip = document.querySelector(".skip");
        if (skip) skip.href = location.pathname + location.search + "#main";
      });
    })();
  </script>
